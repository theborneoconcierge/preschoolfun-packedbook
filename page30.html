  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .game { position: fixed; inset: 0; width: 100vw; width: 100dvw; height: 100vh; height: 100dvh; overflow: hidden; background: #62c3f3; }
    .art { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; }
    .art picture { display: block; width: 100%; height: 100%; }
    .art img { display: block; width: 100%; height: 100%; object-fit: fill; object-position: center; }
    .target { position: absolute; z-index: 1; display: block; border: 0; border-radius: 18%; padding: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .target:focus-visible { outline: 4px solid #fff; outline-offset: -3px; box-shadow: 0 0 0 7px #087fc1; }
    .letter.selected { outline: 2px solid #fa70ac; outline-offset: 0; background: transparent; box-shadow: 0 0 0 1px #fff; }
    .picture.touched { outline: 2px solid #ffca43; outline-offset: 0; background: transparent; box-shadow: 0 0 0 1px #fff; }
    .picture.correct { animation: celebrate .55s ease-in-out 2; }
    @keyframes celebrate { 50% { transform: scale(1.03); box-shadow: 0 0 0 3px #ffe55c; background: transparent; } }
    .hud { position: absolute; z-index: 3; inset: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) auto max(10px, env(safe-area-inset-left)); display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
    .hud a, .music { pointer-events: auto; display: inline-flex; justify-content: center; align-items: center; min-height: 42px; padding: 8px 15px; border: 2px solid white; border-radius: 999px; background: #ffffffed; color: #21517e; box-shadow: 0 3px 10px #164b7940; font: 800 clamp(12px, 2.6vw, 17px)/1.1 system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    .message { position: absolute; z-index: 4; left: 50%; top: 14%; width: min(88vw, 480px); transform: translate(-50%, -10px); padding: 12px 18px; border: 3px solid #fff; border-radius: 22px; background: #fff8dff2; color: #654023; box-shadow: 0 6px 18px #31578150; text-align: center; font: 900 clamp(17px, 3vw, 26px)/1.2 system-ui, sans-serif; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
    .message.show { opacity: 1; transform: translate(-50%, 0); }
    .message.good { background: #e2ffdfed; color: #236534; }
    .message.try { background: #fff2cfef; color: #704c26; }
    @media (orientation: portrait) {
      .target.letter[data-letter="K"] { left: 5.1% !important; top: 32.5% !important; width: 13.7% !important; height: 8.1% !important; }

      .target.letter[data-letter="P"] { left: 21.3% !important; top: 65.8% !important; width: 13.5% !important; height: 7.8% !important; }

      .target.picture[data-match="K"] { left: 40.6% !important; top: 32.8% !important; width: 21.2% !important; height: 11% !important; }
      .target.picture[data-match="R"] { left: 69% !important; top: 34.2% !important; width: 26.9% !important; height: 9% !important; }
      .target.picture[data-match="M"] { left: 39.1% !important; top: 43.4% !important; width: 18% !important; height: 10.1% !important; }
      .target.picture[data-match="A"] { left: 60.4% !important; top: 44.1% !important; width: 17% !important; height: 8.4% !important; }
      .target.picture[data-match="B"] { left: 79.7% !important; top: 46.2% !important; width: 16.8% !important; height: 7.6% !important; }
      .target.picture[data-match="E"] { left: 41.4% !important; top: 53.6% !important; width: 26.8% !important; height: 9% !important; }
      .target.picture[data-match="P"] { left: 77.7% !important; top: 54.2% !important; width: 17.6% !important; height: 8.5% !important; }
      .target.picture[data-match="X"] { left: 61.5% !important; top: 62% !important; width: 20.3% !important; height: 8% !important; }
      .target.picture[data-match="T"] { left: 40.4% !important; top: 66.6% !important; width: 19.3% !important; height: 11% !important; }
      .target.picture[data-match="Q"] { left: 76.3% !important; top: 66.8% !important; width: 19% !important; height: 11% !important; }
    }
    @media (orientation: landscape) {
      .target.letter[data-letter="K"] { left: 10.6% !important; top: 51.3% !important; width: 6.3% !important; height: 15.7% !important; }
      .target.letter[data-letter="A"] { left: 17.6% !important; top: 51.3% !important; width: 6.5% !important; height: 15.7% !important; }
      .target.letter[data-letter="X"] { left: 24.9% !important; top: 51.3% !important; width: 6.1% !important; height: 15.7% !important; }
      .target.letter[data-letter="B"] { left: 31.5% !important; top: 51% !important; width: 6.3% !important; height: 15.7% !important; }
      .target.letter[data-letter="M"] { left: 38.8% !important; top: 51.3% !important; width: 6.6% !important; height: 15.7% !important; }
      .target.letter[data-letter="R"] { left: 13.6% !important; top: 70.8% !important; width: 5.4% !important; height: 16.2% !important; }
      .target.letter[data-letter="T"] { left: 20.3% !important; top: 70.8% !important; width: 6.2% !important; height: 16.2% !important; }
      .target.letter[data-letter="P"] { left: 27.4% !important; top: 70.4% !important; width: 5.8% !important; height: 16.2% !important; }
      .target.letter[data-letter="Q"] { left: 34.1% !important; top: 70.8% !important; width: 7% !important; height: 16.2% !important; }
      .target.picture[data-match="K"] { left: 48.5% !important; top: 47.2% !important; width: 8.4% !important; height: 21% !important; }
      .target.picture[data-match="R"] { left: 59% !important; top: 48.6% !important; width: 10.2% !important; height: 15.4% !important; }
      .target.picture[aria-label="Monkey"] { left: 70.5% !important; top: 47.2% !important; width: 7.2% !important; height: 19.4% !important; }
      .target.picture[data-match="A"] { left: 78.6% !important; top: 48.2% !important; width: 7.6% !important; height: 16.5% !important; }
      .target.picture[data-match="B"] { left: 61% !important; top: 66.8% !important; width: 7.3% !important; height: 15.5% !important; }
      .target.picture[data-match="E"] { left: 48.5% !important; top: 67.5% !important; width: 11.5% !important; height: 21.2% !important; }
      .target.picture[data-match="P"] { left: 71.8% !important; top: 63.8% !important; width: 7.6% !important; height: 16.2% !important; }
      .target.picture[data-match="X"] { left: 73% !important; top: 78.4% !important; width: 8.2% !important; height: 15% !important; }
      .target.picture[data-match="T"] { left: 64.8% !important; top: 75.4% !important; width: 7.4% !important; height: 19.5% !important; }
      .target.picture[data-match="Q"] { left: 81% !important; top: 66% !important; width: 9.5% !important; height: 24.5% !important; }
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="game" aria-label="Letter Detectives matching game">
    <figure class="art" aria-label="Tap a letter, then tap the picture that starts with it">
      <picture>
        <source media="(orientation: portrait)" srcset="letter-detectives-portrait-mobile.png">
        <img src="letter-detectives-landscape.png" alt="Letter Detectives matching worksheet with colorful letters and picture clues">
      </picture>
      <button class="target letter" data-letter="K" aria-label="Letter K" style="left:5%;top:28%;width:14%;height:11%"></button>
      <button class="target letter" data-letter="A" aria-label="Letter A" style="left:19%;top:35%;width:14%;height:11%"></button>
      <button class="target letter" data-letter="X" aria-label="Letter X" style="left:5%;top:44%;width:15%;height:11%"></button>
      <button class="target letter" data-letter="B" aria-label="Letter B" style="left:20%;top:52%;width:14%;height:11%"></button>
      <button class="target letter" data-letter="M" aria-label="Letter M" style="left:5%;top:59%;width:15%;height:11%"></button>
      <button class="target letter" data-letter="R" aria-label="Letter R" style="left:21%;top:66%;width:14%;height:11%"></button>
      <button class="target letter" data-letter="T" aria-label="Letter T" style="left:5%;top:72%;width:15%;height:11%"></button>
      <button class="target letter" data-letter="P" aria-label="Letter P" style="left:21%;top:79%;width:14%;height:11%"></button>
      <button class="target letter" data-letter="Q" aria-label="Letter Q" style="left:5%;top:85%;width:15%;height:11%"></button>

      <button class="target picture" data-match="K" aria-label="Kite" style="left:42%;top:29%;width:19%;height:13%"></button>
      <button class="target picture" data-match="R" aria-label="Rainbow" style="left:70%;top:31%;width:24%;height:12%"></button>
      <button class="target picture" data-match="M" aria-label="Monkey" style="left:40%;top:45%;width:17%;height:13%"></button>
      <button class="target picture" data-match="A" aria-label="Apple" style="left:62%;top:46%;width:16%;height:12%"></button>
      <button class="target picture" data-match="B" aria-label="Beach ball" style="left:81%;top:49%;width:15%;height:10%"></button>
      <button class="target picture" data-match="E" aria-label="Elephant, a try-again picture" style="left:43%;top:60%;width:25%;height:12%"></button>
      <button class="target picture" data-match="P" aria-label="Pencil" style="left:79%;top:61%;width:17%;height:12%"></button>
      <button class="target picture" data-match="X" aria-label="Xylophone" style="left:62%;top:72%;width:20%;height:10%"></button>
      <button class="target picture" data-match="T" aria-label="Teddy bear" style="left:42%;top:80%;width:19%;height:14%"></button>
      <button class="target picture" data-match="Q" aria-label="Queen" style="left:77%;top:80%;width:18%;height:14%"></button>
      <span class="sr-only" id="instruction">Choose a letter, then choose its matching picture. The elephant is a friendly distractor.</span>
    </figure>
    <nav class="hud" aria-label="Game controls">
      <a href="page29.html" aria-label="Back to Z for Zebra">← Z for Zebra</a>
      <button class="music" id="musicToggle" type="button" aria-pressed="false">♫ Music off</button>
    </nav>
    <div class="message" id="message" role="status" aria-live="polite">Tap a letter, then find its picture!</div>
    <audio id="music" src="page2-background-music.mp3" loop preload="auto"></audio>
  </main>
  <script>
    const letters = [...document.querySelectorAll('.letter')];
    const pictures = [...document.querySelectorAll('.picture')];
    const message = document.getElementById('message');
    const music = document.getElementById('music');
    const musicToggle = document.getElementById('musicToggle');
    let selected = null;
    let messageTimer;
    let audioContext;
    function show(text, kind) {
      message.textContent = text;
      message.className = `message show ${kind || ''}`;
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => message.className = 'message', 1900);
    }
    function tone(notes, duration, wave = 'sine') {
      try {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const start = audioContext.currentTime;
        notes.forEach((frequency, i) => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const at = start + i * duration;
          osc.type = wave;
          osc.frequency.setValueAtTime(frequency, at);
          gain.gain.setValueAtTime(.0001, at);
          gain.gain.exponentialRampToValueAtTime(.12, at + .025);
          gain.gain.exponentialRampToValueAtTime(.0001, at + duration * .9);
          osc.connect(gain).connect(audioContext.destination);
          osc.start(at);
          osc.stop(at + duration);
        });
      } catch (_) { /* visual feedback still works when sound is unavailable */ }
    }
    function startMusic() {
      if (music.paused) {
        music.volume = .16;
        music.playbackRate = .78;
        music.play().then(() => {
          musicToggle.textContent = '♫ Music on';
          musicToggle.setAttribute('aria-pressed', 'true');
        }).catch(() => {});
      }
    }
    letters.forEach(button => button.addEventListener('click', () => {
      startMusic();
      letters.forEach(item => item.classList.remove('selected'));
      selected = button.dataset.letter;
      button.classList.add('selected');
      show(`Find a picture that starts with ${selected}!`, '');
    }));
    pictures.forEach(button => button.addEventListener('click', () => {
      startMusic();
      pictures.forEach(item => item.classList.remove('touched'));
      button.classList.add('touched');
      if (!selected) {
        show('Tap a letter first!', 'try');
        tone([392], .16, 'triangle');
        return;
      }
      if (button.dataset.match === selected) {
        const name = {K:'Kite',A:'Apple',X:'Xylophone',B:'Ball',M:'Monkey',R:'Rainbow',T:'Teddy bear',P:'Pencil',Q:'Queen'}[selected];
        show(`That's right! ${selected} is for ${name}!`, 'good');
        button.classList.add('correct');
        setTimeout(() => button.classList.remove('correct'), 1100);
        tone([523.25, 659.25, 783.99], .12);
        selected = null;
        letters.forEach(item => item.classList.remove('selected'));
      } else {
        show(selected === 'K' && button.dataset.match === 'E' ? 'Good try! Find the picture that starts with K.' : 'Try again! Keep your letter and look for its picture.', 'try');
        tone([330, 294], .18, 'triangle');
      }
    }));
    musicToggle.addEventListener('click', () => {
      if (music.paused) {
        startMusic();
        musicToggle.textContent = '♫ Music on';
        musicToggle.setAttribute('aria-pressed', 'true');
      } else {
        music.pause();
        musicToggle.textContent = '♫ Music off';
        musicToggle.setAttribute('aria-pressed', 'false');
      }
    });
    show('Tap a letter, then find its picture!', '');
  </script>
</body>
</html>
