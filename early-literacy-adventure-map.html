<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#078fce">
  <link rel="stylesheet" href="site-skeleton.css">
  <script src="home-button.js" defer></script>
  <title>Early Literacy Adventure Map | Preschool Fun-packed Book</title>
  <style>
    html, body { width: 100%; height: 100%; min-width: 0; min-height: 0; margin: 0; overflow: hidden; }

    .map-page {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #078fce;
    }

    .map-artboard {
      position: relative;
      flex: none;
      width: min(100dvw, calc(100dvh * 2043 / 770));
      height: min(100dvh, calc(100dvw * 770 / 2043));
      margin: 0;
      overflow: hidden;
      aspect-ratio: 2043 / 770;
    }

    .map-artboard picture,
    .map-artboard img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .map-artboard img { object-fit: contain; object-position: center; }

    .hotspot-set { position: absolute; inset: 0; display: none; pointer-events: none; }
    .hotspot { position: absolute; display: block; border: 0; border-radius: 20%; padding: 0; background: transparent; color: transparent; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
    .hotspot:focus-visible { outline: 4px solid #fff; outline-offset: -4px; background: rgb(255 255 255 / 12%); box-shadow: 0 0 0 5px #0754c977; }


    .hs-abc { left: 34%; top: 31%; width: 20%; height: 24%; }
    .hs-case { left: 64%; top: 34%; width: 10%; height: 19%; }
    .hs-sounds { left: 55%; top: 34%; width: 10%; height: 19%; }
    .hs-vocabulary { left: 34%; top: 61%; width: 18%; height: 24%; }
    .hs-matching { left: 77%; top: 32%; width: 19%; height: 23%; }
    .hs-tracing { left: 66%; top: 61%; width: 10%; height: 24%; }
    .hs-prewriting { left: 54%; top: 61%; width: 12%; height: 24%; }
    .hs-which-way { left: 77%; top: 60%; width: 19%; height: 25%; }

    @media (orientation: landscape) {
      .hotspot-set--landscape { display: block; }
    }

    @media (orientation: portrait) {
      .map-artboard {
        width: min(100dvw, calc(100dvh * 863 / 1823));
        height: min(100dvh, calc(100dvw * 1823 / 863));
        aspect-ratio: 863 / 1823;
      }
      .map-artboard img { object-fit: contain; }
      .hotspot-set--portrait { display: block; }
      .hotspot-set--landscape { display: none; }
      .hs-abc { left: 59%; top: 32%; width: 40%; height: 18%; }
      .hs-case { left: 19%; top: 52%; width: 23%; height: 13%; }
      .hs-sounds { left: 0%; top: 52%; width: 20%; height: 13%; }
      .hs-vocabulary { left: 53%; top: 52%; width: 23%; height: 14%; }
      .hs-matching { left: 76%; top: 52%; width: 24%; height: 14%; }
      .hs-tracing { left: 31%; top: 70%; width: 19%; height: 15%; }
      .hs-prewriting { left: 0%; top: 70%; width: 31%; height: 15%; }
      .hs-which-way { left: 58%; top: 70%; width: 42%; height: 15%; }
    }

    @media (max-aspect-ratio: 1 / 1) and (orientation: landscape) {
      .map-artboard { width: min(100dvw, calc(100dvh * 2043 / 770)); height: min(100dvh, calc(100dvw * 770 / 2043)); }
    }

    @media (prefers-reduced-motion: reduce) { .hotspot { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main class="map-page app-viewport" aria-label="Early Literacy Adventure Map">
    <figure class="map-artboard responsive-artboard">
      <picture>
        <source media="(orientation: portrait)" srcset="assets/early_literacy_ocean_map_portrait_863x1823.png">
        <img src="assets/early_literacy_ocean_map_landscape_2043x770.png" alt="An ocean adventure map with eight literacy activity islands">
      </picture>

      <nav class="hotspot-set hotspot-set--landscape" aria-label="Early Literacy activities">
        <a class="hotspot hs-abc" href="page3.html" aria-label="Play the ABC video"></a>
      </nav>

      <nav class="hotspot-set hotspot-set--portrait" aria-label="Early Literacy activities">
        <a class="hotspot hs-abc" href="page3.html" aria-label="Play the ABC video"></a>
      </nav>
    </figure>
  </main>
</body>
</html>
