<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#078fce">
  <link rel="stylesheet" href="site-skeleton.css">
  <script src="home-button.js" defer></script>
  <title>Early Literacy Adventure Map | Preschool Fun-packed Book</title>
  <script>
    (() => {
      const root = document.documentElement;
      const updateViewport = () => {
        const viewport = window.visualViewport;
        root.style.setProperty('--visible-vw', `${viewport?.width || window.innerWidth}px`);
        root.style.setProperty('--visible-vh', `${viewport?.height || window.innerHeight}px`);
      };
      const refreshViewport = () => {
        updateViewport();
        requestAnimationFrame(updateViewport);
        [80, 240, 600].forEach((delay) => window.setTimeout(updateViewport, delay));
      };
      refreshViewport();
      window.addEventListener('resize', refreshViewport, { passive: true });
      window.visualViewport?.addEventListener('resize', refreshViewport, { passive: true });
      window.addEventListener('orientationchange', refreshViewport, { passive: true });
      window.screen.orientation?.addEventListener?.('change', refreshViewport);
      window.addEventListener('pageshow', refreshViewport, { passive: true });
    })();
  </script>
  <style>
    html, body { width: 100%; height: 100%; min-width: 0; min-height: 0; margin: 0; overflow: hidden; }
    .map-page {
      position: fixed; inset: 0 auto auto 0;
      width: var(--visible-vw, 100vw); height: var(--visible-vh, 100dvh);
      display: grid; place-items: stretch; overflow: hidden; background: #078fce;
    }
    .map-artboard { position: relative; width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .map-artboard picture, .map-artboard img { display: block; width: 100%; height: 100%; }
    /* Stretch the provided orientation-specific artwork to the viewport: no bars or blurred filler. */
    .map-artboard img { object-fit: fill; object-position: center; }
    .hotspot-set { position: absolute; inset: 0; display: none; pointer-events: none; }
    .hotspot {
      position: absolute; display: block; border: 0; border-radius: 22%; padding: 0;
      background: transparent; color: transparent; cursor: pointer; pointer-events: auto;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .hotspot:focus-visible { outline: 4px solid #fff; outline-offset: -4px; background: rgb(255 255 255 / 12%); box-shadow: 0 0 0 5px #0754c977; }
    @media (orientation: landscape) {
      .hotspot-set--landscape { display: block; }
      .hs-abc { left: 33%; top: 35%; width: 19%; height: 21%; }
      .hs-sounds { left: 54%; top: 35%; width: 12%; height: 20%; }
      .hs-case { left: 66%; top: 35%; width: 12%; height: 20%; }
      .hs-matching { left: 77%; top: 34%; width: 19%; height: 22%; }
      .hs-vocabulary { left: 31%; top: 62%; width: 19%; height: 26%; }
      .hs-tracing { left: 53%; top: 63%; width: 14%; height: 23%; }
      .hs-prewriting { left: 67%; top: 61%; width: 12%; height: 24%; }
      .hs-which-way { left: 77%; top: 61%; width: 19%; height: 26%; }
    }
    @media (orientation: portrait) {
      .hotspot-set--portrait { display: block; }
      .hs-abc { left: 55%; top: 22%; width: 39%; height: 14%; }
      .hs-sounds { left: 5%; top: 35%; width: 19%; height: 12%; }
      .hs-case { left: 23%; top: 35%; width: 21%; height: 12%; }
      .hs-matching { left: 59%; top: 50%; width: 38%; height: 14%; }
      .hs-vocabulary { left: 5%; top: 68%; width: 39%; height: 13%; }
      .hs-tracing { left: 59%; top: 71%; width: 22%; height: 13%; }
      .hs-prewriting { left: 79%; top: 71%; width: 19%; height: 13%; }
      .hs-which-way { left: 22%; top: 84%; width: 40%; height: 13%; }
    }
    @media (prefers-reduced-motion: reduce) { .hotspot { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main class="map-page app-viewport" aria-label="Early Literacy Adventure Map">
    <figure class="map-artboard responsive-artboard">
      <picture>
        <source media="(orientation: portrait)" srcset="assets/early_literacy_ocean_map_portrait.jpg">
        <img src="assets/early_literacy_ocean_map_landscape.jpg" alt="Ocean adventure map with islands for letters, sounds, vocabulary, matching, and writing activities">
      </picture>
      <nav class="hotspot-set hotspot-set--landscape" aria-label="Early Literacy activities">
        <a class="hotspot hs-abc" href="page3.html" aria-label="Play the ABC video"></a>
        <a class="hotspot hs-sounds" href="page3.html" aria-label="Listen to letter sounds with Afri"></a>
        <a class="hotspot hs-case" href="page30.html" aria-label="Explore letters with Letter Detectives"></a>
        <a class="hotspot hs-matching" href="page4.html" aria-label="Practice matching letters with ABC flashcards"></a>
        <a class="hotspot hs-vocabulary" href="page7.html" aria-label="Explore vocabulary with the dog activity"></a>
        <a class="hotspot hs-tracing" href="page4.html" aria-label="Practice tracing letters"></a>
        <a class="hotspot hs-prewriting" href="page4.html" aria-label="Practice pre-writing with letter activities"></a>
        <a class="hotspot hs-which-way" href="page30.html" aria-label="Open the Letter Detectives activity"></a>
      </nav>
      <nav class="hotspot-set hotspot-set--portrait" aria-label="Early Literacy activities">
        <a class="hotspot hs-abc" href="page3.html" aria-label="Play the ABC video"></a>
        <a class="hotspot hs-sounds" href="page3.html" aria-label="Listen to letter sounds with Afri"></a>
        <a class="hotspot hs-case" href="page30.html" aria-label="Explore letters with Letter Detectives"></a>
        <a class="hotspot hs-matching" href="page4.html" aria-label="Practice matching letters with ABC flashcards"></a>
        <a class="hotspot hs-vocabulary" href="page7.html" aria-label="Explore vocabulary with the dog activity"></a>
        <a class="hotspot hs-tracing" href="page4.html" aria-label="Practice tracing letters"></a>
        <a class="hotspot hs-prewriting" href="page4.html" aria-label="Practice pre-writing with letter activities"></a>
        <a class="hotspot hs-which-way" href="page30.html" aria-label="Open the Letter Detectives activity"></a>
      </nav>
    </figure>
  </main>
</body>
</html>
