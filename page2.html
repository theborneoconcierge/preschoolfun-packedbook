  <script>
    (() => {
      const ua = navigator.userAgent;
      const brands = navigator.userAgentData?.brands || [];
      const isAndroid = navigator.userAgentData?.mobile === true || /Android/i.test(ua);
      const isEdge = brands.some(({ brand }) => /Microsoft Edge/i.test(brand)) || /EdgA|EdgiOS|Edg\//i.test(ua);
      const isChrome = brands.some(({ brand }) => /^Google Chrome$/i.test(brand)) || /Chrome\//i.test(ua);
      if (!isAndroid || isEdge || !isChrome) return;

      document.documentElement.classList.add('android-chrome');
      const updateVisibleViewport = () => {
        const viewport = window.visualViewport;
        if (!viewport) return;
        document.documentElement.style.setProperty('--android-chrome-vw', `${viewport.width}px`);
        document.documentElement.style.setProperty('--android-chrome-vh', `${viewport.height}px`);
      };
      updateVisibleViewport();
      window.visualViewport?.addEventListener('resize', updateVisibleViewport, { passive: true });
      window.addEventListener('resize', updateVisibleViewport, { passive: true });
    })();
  </script>
  <style>

    .butterfly-wing { transform-box: fill-box; animation: butterfly-flap 360ms ease-in-out infinite alternate; }
    .butterfly-wing--left { transform-origin: right center; }
    .butterfly-wing--right { transform-origin: left center; animation-delay: -120ms; }
    .bee { width: clamp(12px, 1.8vw, 24px); }
    .bee--one { left: 1%; top: 93%; animation: bee-flight-one 9s ease-in-out infinite; }
    .bee--two { right: 0.1%; top: 86%; animation: bee-flight-two 11s ease-in-out -3s infinite; }
    .bee-wing { fill: #f5fcff; stroke: #9ccddd; stroke-width: 2; transform-box: fill-box; transform-origin: center bottom; animation: bee-flap 120ms ease-in-out infinite alternate; }

  <!-- Children's Instrumental 01 by alanajordan, Pixabay Content License:
       https://pixabay.com/music/happy-childrens-tunes-childrenx27s-instrumental-01-368715/ -->
  <audio id="page2-music" src="page2-background-music.mp3" loop preload="auto"></audio>
  <script>
    const artboard = document.querySelector('.artboard');
    const artwork = artboard.querySelector('img');
    const panelLinks = [...artboard.querySelectorAll('.panel-link')];
    const pageNav = document.querySelector('.page-nav');
    const pageNavControls = [...pageNav.children];

    function placeLaptopPanelLinks() {
      const laptopLayout = window.matchMedia('(min-width: 1240px) and (orientation: landscape)').matches;
      const tabletLandscape = window.matchMedia('(min-width: 768px) and (max-width: 1239px) and (min-height: 600px) and (orientation: landscape)').matches;
      if (!laptopLayout || !artwork.naturalWidth || !artwork.naturalHeight) {
        for (const link of panelLinks) {
          for (const property of ['left', 'top', 'width', 'height']) link.style.removeProperty(property);
        }
        if (tabletLandscape) {
          const tabletPanels = [
            [0.146, 0.291, 0.247, 0.168], [0.397, 0.291, 0.252, 0.168], [0.652, 0.291, 0.239, 0.168],
            [0.144, 0.463, 0.249, 0.169], [0.396, 0.463, 0.253, 0.169], [0.652, 0.463, 0.239, 0.169],
            [0.140, 0.638, 0.253, 0.182], [0.397, 0.638, 0.253, 0.182], [0.652, 0.638, 0.239, 0.182]
          ];
          panelLinks.forEach((link, index) => {
            const [x, y, width, height] = tabletPanels[index];
            link.style.left = `${x * 100}%`;
            link.style.top = `${y * 100}%`;
            link.style.width = `${width * 100}%`;
            link.style.height = `${height * 100}%`;
          });
        }
        return;
      }

      const board = artboard.getBoundingClientRect();
      const scale = Math.max(board.width / artwork.naturalWidth, board.height / artwork.naturalHeight);
      const drawnWidth = artwork.naturalWidth * scale;
      const drawnHeight = artwork.naturalHeight * scale;
      const offsetX = (board.width - drawnWidth) / 2;
      const offsetY = (board.height - drawnHeight) / 2;
      const laptopPanels = [
        [0.135, 0.242, 0.244, 0.222], [0.383, 0.242, 0.234, 0.222], [0.625, 0.242, 0.240, 0.222],
        [0.132, 0.468, 0.245, 0.222], [0.382, 0.468, 0.236, 0.222], [0.624, 0.468, 0.243, 0.222],
        [0.130, 0.694, 0.247, 0.240], [0.380, 0.694, 0.238, 0.240], [0.623, 0.694, 0.246, 0.240]
      ];

      panelLinks.forEach((link, index) => {
        const [x, y, width, height] = laptopPanels[index];
        link.style.left = `${offsetX + drawnWidth * x}px`;
        link.style.top = `${offsetY + drawnHeight * y}px`;
        link.style.width = `${drawnWidth * width}px`;
        link.style.height = `${drawnHeight * height}px`;
      });
    }

    function placeTabletPortraitPanelLinks() {
      const tabletPortrait = window.matchMedia('(min-width: 768px) and (max-width: 1239px) and (min-height: 900px) and (orientation: portrait)').matches;
      if (!tabletPortrait || !artwork.naturalWidth || !artwork.naturalHeight) return;

      const portraitPanels = [
        [0.047, 0.307, 0.310, 0.143], [0.361, 0.307, 0.296, 0.143], [0.661, 0.307, 0.295, 0.143],
        [0.047, 0.455, 0.310, 0.149], [0.361, 0.455, 0.296, 0.149], [0.661, 0.455, 0.295, 0.149],
        [0.047, 0.608, 0.310, 0.148], [0.361, 0.608, 0.296, 0.148], [0.661, 0.608, 0.295, 0.148]
      ];
      const board = artboard.getBoundingClientRect();
      const scale = Math.max(board.width / artwork.naturalWidth, board.height / artwork.naturalHeight);
      const drawnWidth = artwork.naturalWidth * scale, drawnHeight = artwork.naturalHeight * scale;
      const offsetX = (board.width - drawnWidth) / 2, offsetY = (board.height - drawnHeight) / 2;
      panelLinks.forEach((link, index) => {
        const [x, y, width, height] = portraitPanels[index];
        Object.assign(link.style, { left: `${offsetX + drawnWidth * x}px`, top: `${offsetY + drawnHeight * y}px`, width: `${drawnWidth * width}px`, height: `${drawnHeight * height}px` });
      });
    }

    function placeMobilePortraitPanelLinks() {
      const mobilePortrait = window.matchMedia('(pointer: coarse) and (orientation: portrait) and (max-height: 1000px)').matches
        || window.matchMedia('(max-width: 600px) and (orientation: portrait)').matches;
      if (!mobilePortrait || !artwork.naturalWidth || !artwork.naturalHeight) return;

      const aspectPortrait = artwork.currentSrc.includes("page2-mobile-portrait-viewport.png");
      const portraitPanels = aspectPortrait ? [
        [0.05, 0.320, 0.30, 0.157], [0.35, 0.320, 0.30, 0.157], [0.65, 0.320, 0.30, 0.157],
        [0.05, 0.480, 0.30, 0.158], [0.35, 0.480, 0.30, 0.158], [0.65, 0.480, 0.30, 0.158],
        [0.05, 0.644, 0.30, 0.157], [0.35, 0.644, 0.30, 0.157], [0.65, 0.644, 0.30, 0.157]
      ] : [
        [0.012, 0.322, 0.320, 0.170], [0.347, 0.322, 0.310, 0.170], [0.665, 0.322, 0.315, 0.170],
        [0.012, 0.495, 0.320, 0.162], [0.347, 0.495, 0.310, 0.162], [0.665, 0.495, 0.315, 0.162],
        [0.012, 0.658, 0.320, 0.162], [0.347, 0.658, 0.310, 0.162], [0.665, 0.658, 0.315, 0.162]
      ];
      if (aspectPortrait) {
        const board = artboard.getBoundingClientRect();
        const scale = Math.min(board.width / artwork.naturalWidth, board.height / artwork.naturalHeight);
        const drawnWidth = artwork.naturalWidth * scale, drawnHeight = artwork.naturalHeight * scale;
        const offsetX = (board.width - drawnWidth) / 2, offsetY = (board.height - drawnHeight) / 2;
        panelLinks.forEach((link, index) => {
          const [x, y, width, height] = portraitPanels[index];
          Object.assign(link.style, { left: `${offsetX + drawnWidth * x}px`, top: `${offsetY + drawnHeight * y}px`, width: `${drawnWidth * width}px`, height: `${drawnHeight * height}px` });
        });
        return;
      }
      const fullbleedImage = artwork.currentSrc.includes('page2-mobile-portrait-full.png');
      if (document.documentElement.classList.contains('android-chrome')) {
        panelLinks.forEach(link => {
          link.style.left = 'var(--x-portrait)';
          link.style.top = 'var(--y-portrait)';
          link.style.width = 'var(--w-portrait)';
          link.style.height = 'var(--h-portrait)';
        });
        return;
      }
      const imageWidth = fullbleedImage ? 412 : artwork.naturalWidth;
      const insetX = fullbleedImage ? (artwork.naturalWidth - imageWidth) / 2 : 0;
      panelLinks.forEach((link, index) => {
        const [x, y, width, height] = portraitPanels[index];
        link.style.left = `${(insetX + imageWidth * x) / artwork.naturalWidth * 100}%`;
        link.style.top = `${y * 100}%`;
        link.style.width = `${imageWidth * width / artwork.naturalWidth * 100}%`;
        link.style.height = `${height * 100}%`;
      });
    }

    function placeMobileLandscapePanelLinks() {
      const mobileLandscape = window.matchMedia('(pointer: coarse) and (orientation: landscape) and (max-height: 600px)').matches
        || window.matchMedia('(max-width: 1023px) and (min-aspect-ratio: 7 / 4) and (orientation: landscape)').matches;
      if (!mobileLandscape || !artwork.naturalWidth || !artwork.naturalHeight) return;

      const aspectLandscape = artwork.currentSrc.includes("page2-mobile-landscape-viewport.png");
      const mobilePanels = aspectLandscape ? [
        [0.232, 0.249, 0.175, 0.171], [0.407, 0.249, 0.176, 0.171], [0.584, 0.249, 0.176, 0.171],
        [0.232, 0.424, 0.175, 0.171], [0.407, 0.424, 0.176, 0.171], [0.584, 0.424, 0.176, 0.171],
        [0.232, 0.602, 0.175, 0.177], [0.407, 0.602, 0.176, 0.177], [0.584, 0.602, 0.176, 0.177]
      ] : [
        [0.181, 0.298, 0.214, 0.192], [0.398, 0.298, 0.209, 0.192], [0.608, 0.298, 0.218, 0.192],
        [0.181, 0.497, 0.214, 0.188], [0.398, 0.497, 0.209, 0.188], [0.608, 0.497, 0.218, 0.188],
        [0.181, 0.690, 0.214, 0.195], [0.398, 0.690, 0.209, 0.195], [0.608, 0.690, 0.218, 0.195]
      ];
      const fullbleedImage = artwork.currentSrc.includes('page2-mobile-landscape-full.png');
      const imageWidth = fullbleedImage ? 924 : artwork.naturalWidth;
      const insetX = fullbleedImage ? (artwork.naturalWidth - imageWidth) / 2 : 0;
      panelLinks.forEach((link, index) => {
        const [x, y, width, height] = mobilePanels[index];
        link.style.left = `${(insetX + imageWidth * x) / artwork.naturalWidth * 100}%`;
        link.style.top = `${y * 100}%`;
        link.style.width = `${imageWidth * width / artwork.naturalWidth * 100}%`;
        link.style.height = `${height * 100}%`;
      });
    }

    function positionPageNav() {
      if (!artwork.naturalWidth || !artwork.naturalHeight) return;

      const board = artboard.getBoundingClientRect();
      const imageName = decodeURIComponent(artwork.currentSrc.split('/').pop().split('?')[0]);
      const isFullbleedPortrait = imageName === 'page2-mobile-portrait-full.png';
      const isFullbleedLandscape = imageName === 'page2-mobile-landscape-full.png';
      const fullbleedBaseWidth = isFullbleedPortrait ? 412 : isFullbleedLandscape ? 924 : artwork.naturalWidth;
      const insetX = (artwork.naturalWidth - fullbleedBaseWidth) / 2;
      const fillImage = isFullbleedPortrait || isFullbleedLandscape;
      const chromeCover = document.documentElement.classList.contains('android-chrome') && isFullbleedPortrait;
      const scale = getComputedStyle(artwork).objectFit === 'cover'
        ? Math.max(board.width / artwork.naturalWidth, board.height / artwork.naturalHeight)
        : Math.min(board.width / artwork.naturalWidth, board.height / artwork.naturalHeight);
      const scaleX = fillImage && !chromeCover ? board.width / artwork.naturalWidth : scale;
      const scaleY = fillImage && !chromeCover ? board.height / artwork.naturalHeight : scale;
      const drawnWidth = artwork.naturalWidth * scaleX;
      const drawnHeight = artwork.naturalHeight * scaleY;
      const offsetX = fillImage && !chromeCover ? 0 : (board.width - drawnWidth) / 2;
      const offsetY = fillImage && !chromeCover ? 0 : (board.height - drawnHeight) / 2;
      let artworkButtons = imageName === 'page2-laptop.png'
        ? [[0.018, 0.870, 0.153, 0.097], [0.856, 0.870, 0.128, 0.097]]
        : imageName === 'page2-mobile-portrait.png' || imageName === 'page2-mobile-portrait-viewport.png' || isFullbleedPortrait
          ? (imageName === 'page2-mobile-portrait-viewport.png' ? [[0.094, 0.886, 0.383, 0.062], [0.528, 0.886, 0.376, 0.062]] : [[0.034, 0.911, 0.437, 0.059], [0.563, 0.911, 0.408, 0.059]])
        : imageName === 'page2-tablet-landscape.png'
          ? [[0.017, 0.879, 0.211, 0.079], [0.798, 0.879, 0.188, 0.079]]
        : imageName === 'page2-tablet-portrait.png'
          ? [[0.192, 0.900, 0.261, 0.054], [0.560, 0.900, 0.247, 0.054]]
        : imageName === 'page2-mobile-landscape.png' || imageName === 'page2-mobile-landscape-viewport.png' || isFullbleedLandscape
          ? (imageName === 'page2-mobile-landscape-viewport.png' ? [[0.074, 0.830, 0.198, 0.105], [0.758, 0.830, 0.174, 0.105]] : [[0.022, 0.862, 0.169, 0.099], [0.820, 0.862, 0.161, 0.099]])
        : imageName === 'Afri 9 Panels Portrait.png'
          ? [[0.184, 0.878, 0.326, 0.046], [0.544, 0.878, 0.276, 0.046]]
          : null;
      if (fillImage && artworkButtons) {
        artworkButtons = artworkButtons.map(([x, y, width, height]) => [
          (insetX + fullbleedBaseWidth * x) / artwork.naturalWidth,
          y,
          fullbleedBaseWidth * width / artwork.naturalWidth,
          height
        ]);
      }
      const controlsFit = artworkButtons?.every(([x, y, width, height]) => {
        const left = offsetX + drawnWidth * x;
        const top = offsetY + drawnHeight * y;
        return left >= 0 && top >= 0 && left + drawnWidth * width <= board.width && top + drawnHeight * height <= board.height;
      });

      pageNav.classList.add('artwork-positioned');
      pageNav.classList.toggle('artwork-hit-areas', Boolean(controlsFit));
      pageNav.classList.toggle('artwork-visible-controls', !controlsFit);
      Object.assign(pageNav.style, {
        left: `${board.left + (controlsFit ? offsetX : 0)}px`,
        top: `${board.top + (controlsFit ? offsetY : 0)}px`,
        width: `${controlsFit ? drawnWidth : board.width}px`,
        height: `${controlsFit ? drawnHeight : board.height}px`
      });

      pageNavControls.forEach((control, index) => {
        control.style.left = '';
        control.style.right = '';
        control.style.top = '';
        control.style.width = '';
        control.style.height = '';
        if (controlsFit) {
          const [x, y, width, height] = artworkButtons[index];
          Object.assign(control.style, {
            left: `${x * 100}%`,
            top: `${y * 100}%`,
            width: `${width * 100}%`,
            height: `${height * 100}%`
          });
        }
      });
    }

    function updateResponsiveLayout() {
      placeLaptopPanelLinks();
      placeTabletPortraitPanelLinks();
      placeMobilePortraitPanelLinks();
      placeMobileLandscapePanelLinks();
      positionPageNav();
    }

    let responsiveLayoutFrame = 0;
    function scheduleResponsiveLayout() {
      cancelAnimationFrame(responsiveLayoutFrame);
      responsiveLayoutFrame = requestAnimationFrame(() => {
        responsiveLayoutFrame = requestAnimationFrame(updateResponsiveLayout);
      });
    }

    artwork.addEventListener('load', scheduleResponsiveLayout);
    window.addEventListener('resize', scheduleResponsiveLayout, { passive: true });
    window.addEventListener('orientationchange', scheduleResponsiveLayout, { passive: true });
    window.visualViewport?.addEventListener('resize', scheduleResponsiveLayout, { passive: true });
    updateResponsiveLayout();

    const page2Music = document.getElementById('page2-music');
    const musicToggle = document.getElementById('music-toggle');
    let musicWanted = true;

    page2Music.volume = 0.2;

    function updateMusicControl(isPlaying) {
      musicToggle.setAttribute('aria-pressed', String(isPlaying));
      musicToggle.setAttribute('aria-label', isPlaying ? 'Turn background music off' : 'Turn background music on');
      musicToggle.textContent = isPlaying ? '♫ Music: On' : '♫ Music: Off';
    }

    async function startPage2Music() {
      if (!musicWanted) return;
      try {
        await page2Music.play();
        updateMusicControl(true);
      } catch {
        updateMusicControl(false);
      }
    }

    musicToggle.addEventListener('click', async () => {
      if (!page2Music.paused) {
        musicWanted = false;
        page2Music.pause();
        updateMusicControl(false);
        return;
      }

      musicWanted = true;
      await startPage2Music();
    });

    window.addEventListener('pageshow', startPage2Music);
    window.addEventListener('pagehide', () => {
      page2Music.pause();
      updateMusicControl(false);
    });

  </script>
