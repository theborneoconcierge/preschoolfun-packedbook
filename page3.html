<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Preschool Fun">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#43b9f4">
  <link rel="stylesheet" href="site-skeleton.css">
  <title>Afri’s Alphabet Video | Preschool Fun</title>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }

    .page3-stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0;
      background: #14264b;
    }

    .video-card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .media-player {
      width: min(calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), 72rem, calc((100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
      width: min(calc(100dvw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), 72rem, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
      max-width: 100%;
      margin: 0;
    }

    .media-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .media-frame video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .page-navigation {
      position: fixed;
      z-index: 2;
      inset: 50% env(safe-area-inset-right, 0px) auto env(safe-area-inset-left, 0px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-inline: clamp(.5rem, 3vw, 2rem);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .page-navigation .button {
      width: clamp(3rem, 9vw, 4rem);
      min-height: clamp(3rem, 9vw, 4rem);
      padding: 0;
      justify-content: center;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      line-height: 1;
      pointer-events: auto;
      border: 2px solid #fff;
      box-shadow: 0 3px 12px rgb(0 0 0 / 35%);
    }
  </style>
</head>
<body>
  <main class="page3-stage">
    <section class="content-card video-card" aria-label="Afri’s alphabet video">
      <div class="media-player">
        <div class="media-frame">
          <video controls autoplay playsinline preload="metadata" aria-label="Afri’s alphabet video">
            <source src="videos/afri-alphabet.mp4" type="video/mp4">
            Your browser cannot play this video.
          </video>
        </div>
      </div>

      <nav class="page-navigation" aria-label="Page navigation">
        <a class="button" href="page2.html" aria-label="Back to menu" title="Back">←</a>
        <a class="button" href="page4.html" aria-label="Start letter A" title="Next">→</a>
      </nav>
    </section>
  </main>
</body>
</html>
