<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Preschool Fun">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#14264b">
  <link rel="stylesheet" href="site-skeleton.css">
  <script src="home-button.js" defer></script>
  <title>Afri’s Alphabet Video | Preschool Fun</title>
  <script>
    (() => {
      const root = document.documentElement;
      const updateViewport = () => {
        const viewport = window.visualViewport;
        root.style.setProperty('--visible-vw', `${viewport?.width || window.innerWidth}px`);
        root.style.setProperty('--visible-vh', `${viewport?.height || window.innerHeight}px`);
        root.style.setProperty('--visible-left', `${viewport?.offsetLeft || 0}px`);
        root.style.setProperty('--visible-top', `${viewport?.offsetTop || 0}px`);
      };
      updateViewport();
      window.addEventListener('resize', updateViewport, { passive: true });
      window.visualViewport?.addEventListener('resize', updateViewport, { passive: true });
      window.visualViewport?.addEventListener('scroll', updateViewport, { passive: true });
      window.addEventListener('orientationchange', updateViewport, { passive: true });
    })();
  </script>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }

    .page3-stage {
      position: fixed;
      left: var(--visible-left, 0px);
      top: var(--visible-top, 0px);
      width: var(--visible-vw, 100vw);
      height: var(--visible-vh, 100dvh);
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0;
      background: #14264b;
    }

    .video-card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .media-player {
      width: min(calc(var(--visible-vw, 100vw) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), 72rem, calc((var(--visible-vh, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
      max-width: 100%;
      margin: 0;
    }

    .media-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .media-frame video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .page-navigation {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-inline: clamp(.5rem, 3vw, 2rem);
      transform: none;
      pointer-events: none;
    }

    .page-navigation .button {
      width: clamp(3rem, 9vw, 4rem);
      min-height: clamp(3rem, 9vw, 4rem);
      padding: 0;
      justify-content: center;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      line-height: 1;
      pointer-events: auto;
      border: 2px solid #fff;
      box-shadow: 0 3px 12px rgb(0 0 0 / 35%);
    }

    .page-navigation .map-back-control {
      position: fixed;
      left: max(.5rem, env(safe-area-inset-left, 0px));
      display: block;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(2.125rem, 4vw, 3rem);
      height: clamp(2.125rem, 4vw, 3rem);
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 1rem;
      pointer-events: auto;
      box-shadow: 0 3px 12px rgb(0 0 0 / 35%);
    }

    .video-activity-links {
      position: fixed;
      top: 50%;
      right: max(.5rem, env(safe-area-inset-right, 0px));
      display: grid;
      gap: .65rem;
      transform: translateY(-50%);
    }

    .video-activity-links a {
      display: block;
      width: clamp(2.5rem, 4.5vw, 3.5rem);
      aspect-ratio: 1;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 1rem;
      background: white;
      pointer-events: auto;
      box-shadow: 0 3px 12px rgb(0 0 0 / 35%);
      transition: transform .15s ease;
    }

    .video-activity-links a:hover { transform: scale(1.06); }
    .video-activity-links img, .map-back-control img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .map-back-control img { object-fit: cover; object-position: 52% center; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 600px) {
      .page-navigation .map-back-control { top: auto; bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)); left: max(.75rem, env(safe-area-inset-left, 0px)); transform: none; width: 2.125rem; height: 2.125rem; }
      .video-activity-links { top: auto; right: max(.75rem, env(safe-area-inset-right, 0px)); bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)); transform: none; }
      .video-activity-links a { width: 2.5rem; border-radius: .5rem; }
    }
  </style>
</head>
<body>
  <main class="page3-stage">
    <section class="content-card video-card" aria-label="Afri’s alphabet video">
      <div class="media-player">
        <div class="media-frame">
          <video controls autoplay playsinline preload="metadata" aria-label="Afri’s alphabet video">
            <source src="videos/afri-alphabet.mp4" type="video/mp4">
            Your browser cannot play this video.
          </video>
        </div>
      </div>

      <nav class="page-navigation" aria-label="Page navigation">
        <a class="map-back-control" href="early-literacy-adventure-map.html" aria-label="Back to Afri’s Adventure Map" title="Back to Afri’s Adventure Map"><img src="assets/afris_colorful_adventure_map.png" alt=""></a>
        <div class="video-activity-links" aria-label="More ABC activities">
          <a href="page4.html" aria-label="Open ABC Flashcards" title="ABC Flashcards"><img src="assets/abc_flash_card_icon.png" alt=""><span class="visually-hidden">ABC Flashcards</span></a>
          <a href="page30.html" aria-label="Open Letter Detectives" title="Letter Detectives"><img src="assets/letter_detectives_icon.png" alt=""><span class="visually-hidden">Letter Detectives</span></a>
        </div>
      </nav>
    </section>
  </main>
</body>
</html>
